name: Validate and Add New Provider

# Provider submissions arrive as public issues. Validation (which checks out the
# submitted repository, uses repository secrets and opens a PR) only starts when
# a maintainer applies the `run-provider-validation` label or dispatches this
# workflow. Issue-form labels such as `new-source` are applied automatically for
# any author, so they are not an approval signal. See README "Contributing".
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to validate'
        required: true
        type: number

permissions: {}

jobs:
  acknowledge:
    if: >-
      github.event_name == 'issues' && github.event.action == 'opened' &&
      (contains(github.event.issue.labels.*.name, 'new-source') ||
       contains(github.event.issue.body, '### Repository URL'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Explain the review process
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `Thanks @${author} for submitting a provider! 🙌`,
                '',
                'A maintainer will review this submission and then start automated validation',
                '(gitleaks secrets scan, LGTM skill quality check, prompt-injection check).',
                'If everything passes, a pull request adding your provider is opened automatically',
                'and the result is posted here.',
              ].join('\n'),
            });

  validate-provider:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'run-provider-validation')
    runs-on: ubuntu-latest
    concurrency:
      group: provider-intake-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Verify maintainer permission
        uses: actions/github-script@v7
        with:
          script: |
            const login = context.payload.sender.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: login,
            });
            if (!['admin', 'maintain', 'write'].includes(data.permission)) {
              core.setFailed(`@${login} lacks write access; a maintainer must start provider validation.`);
            }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install pyyaml requests

      - name: Install gitleaks
        run: |
          cd /tmp
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks_8.18.1_linux_x64.tar.gz
          gitleaks version

      - name: Fetch issue (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            core.exportVariable('DISPATCH_ISSUE_BODY', issue.body || '');
            core.exportVariable('DISPATCH_ISSUE_USER', issue.user.login);
            core.exportVariable('DISPATCH_ISSUE_NUMBER', String(issueNumber));

      # All issue fields are validated against strict allowlists and every URL is
      # regenerated from the validated owner/repo/branch (scripts/provider_intake.py).
      - name: Parse and validate submission
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python scripts/provider_intake.py parse

      - name: Comment on issue - Invalid submission
        if: failure() && steps.parse.outputs.error != ''
        uses: actions/github-script@v7
        env:
          PARSE_ERROR: ${{ steps.parse.outputs.error }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: [
                '## ❌ Submission could not be validated',
                '',
                process.env.PARSE_ERROR,
                '',
                'Please edit the issue to fix the fields above. A maintainer will re-run validation.',
              ].join('\n'),
            });

      - name: Checkout contributor's repository
        if: steps.parse.outputs.repo_owner
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse.outputs.repo_owner }}/${{ steps.parse.outputs.repo_name }}
          path: ./contributor-repo
          persist-credentials: false

      - name: Run gitleaks scan on contributor repo
        if: steps.parse.outputs.repo_owner
        id: gitleaks
        continue-on-error: true
        run: |
          echo "Running gitleaks scan..."
          if gitleaks detect --source ./contributor-repo --no-git --exit-code 1 --report-path /tmp/gitleaks-report.json; then
            echo "gitleaks_passed=true" >> $GITHUB_OUTPUT
          else
            echo "gitleaks_passed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Gitleaks detected potential secrets in the repository"
          fi

      - name: Validate skills with LGTM Agent Skills
        if: steps.parse.outputs.repo_owner
        id: lgtm
        continue-on-error: true
        uses: dmgrok/LGTM_agent_skills@main
        with:
          path: './contributor-repo/${{ steps.parse.outputs.skills_path_prefix }}'
          min-score: 70
          fail-on-error: false
          lakera-api-key: ${{ secrets.LAKERA_GUARD_API_KEY }}

      - name: Set LGTM defaults if action failed
        if: steps.lgtm.outcome == 'failure' || steps.lgtm.outcome == 'skipped'
        id: lgtm_defaults
        run: |
          echo "passed=pending" >> $GITHUB_OUTPUT
          echo "score=70" >> $GITHUB_OUTPUT
          echo "spec-compliance=N/A" >> $GITHUB_OUTPUT
          echo "security=N/A" >> $GITHUB_OUTPUT
          echo "content=N/A" >> $GITHUB_OUTPUT
          echo "testing=N/A" >> $GITHUB_OUTPUT
          echo "originality=N/A" >> $GITHUB_OUTPUT
          echo "⚠️ LGTM validation skipped - will require manual review"

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            /tmp/gitleaks-report.json

      - name: Check validation results
        id: check
        env:
          LGTM_PASSED: ${{ steps.lgtm.outputs.passed || steps.lgtm_defaults.outputs.passed }}
          LGTM_SCORE: ${{ steps.lgtm.outputs.score || steps.lgtm_defaults.outputs.score }}
          GITLEAKS_PASSED: ${{ steps.gitleaks.outputs.gitleaks_passed }}
        run: |
          echo "LGTM Score: $LGTM_SCORE"
          echo "LGTM Passed: $LGTM_PASSED"
          echo "Gitleaks Passed: $GITLEAKS_PASSED"

          # Allow pending LGTM (manual review needed) but require gitleaks to pass
          if ([ "$LGTM_PASSED" = "true" ] || [ "$LGTM_PASSED" = "pending" ]) && [ "$GITLEAKS_PASSED" = "true" ]; then
            echo "validation_passed=true" >> $GITHUB_OUTPUT
            echo "✅ All validations passed!"
          else
            echo "validation_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Validation failed"
          fi

      - name: Test provider configuration (lightweight)
        if: steps.check.outputs.validation_passed == 'true'
        id: test_provider
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER_CONFIG_JSON: ${{ steps.parse.outputs.config_json }}
        run: python scripts/test_provider.py "$PROVIDER_CONFIG_JSON"

      - name: Add provider to aggregate.py
        if: steps.test_provider.outcome == 'success'
        id: add_provider
        env:
          PROVIDER_CONFIG_JSON: ${{ steps.parse.outputs.config_json }}
        run: python scripts/provider_intake.py add-provider

      - name: Clean up working directory
        if: steps.check.outputs.validation_passed == 'true'
        run: |
          # Remove any artifacts that could accidentally be committed
          rm -rf contributor-repo gitleaks* lgtm-results.json
          # Only stage the file we actually want to change
          git diff --name-only

      - name: Create Pull Request
        if: steps.check.outputs.validation_passed == 'true'
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat: Add ${{ steps.parse.outputs.provider_name }} provider'
          branch: add-provider-${{ steps.parse.outputs.provider_id }}
          delete-branch: true
          add-paths: |
            scripts/aggregate.py
          title: '🤖 Add ${{ steps.parse.outputs.provider_name }} provider'
          body: |
            ## 🎉 Automated Provider Addition

            This PR was automatically created from issue #${{ steps.parse.outputs.issue_number }}

            ### Provider Details
            - **Name**: ${{ steps.parse.outputs.provider_name }}
            - **Repository**: ${{ steps.parse.outputs.repo_url }}
            - **ID**: `${{ steps.parse.outputs.provider_id }}`

            ### Validation Results
            - ✅ LGTM Score: ${{ steps.lgtm.outputs.score || steps.lgtm_defaults.outputs.score }}/100
            - ✅ Security scan passed (gitleaks)
            - ✅ Spec compliance: ${{ steps.lgtm.outputs.spec-compliance || steps.lgtm_defaults.outputs.spec-compliance }}
            - ✅ Security KPI: ${{ steps.lgtm.outputs.security || steps.lgtm_defaults.outputs.security }}
            - ✅ Content quality: ${{ steps.lgtm.outputs.content || steps.lgtm_defaults.outputs.content }}
            - ✅ Testing: ${{ steps.lgtm.outputs.testing || steps.lgtm_defaults.outputs.testing }}
            - ✅ Originality: ${{ steps.lgtm.outputs.originality || steps.lgtm_defaults.outputs.originality }}

            ${{ steps.lgtm.outcome == 'failure' && '⚠️ LGTM validation was unavailable, so the skills need a manual review.' || '' }}

            ### Changes
            - Added provider configuration to `scripts/aggregate.py`

            ### Next Steps
            - Review the changes
            - Merge to include provider in daily aggregation runs

            ---
            Requested by: @${{ steps.parse.outputs.issue_user }}
            Closes #${{ steps.parse.outputs.issue_number }}
          labels: |
            automated
            new-provider

      - name: Comment on issue - Success
        if: steps.check.outputs.validation_passed == 'true' && steps.create_pr.outputs.pull-request-number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          ISSUE_USER: ${{ steps.parse.outputs.issue_user }}
          PROVIDER_NAME: ${{ steps.parse.outputs.provider_name }}
          PROVIDER_ID: ${{ steps.parse.outputs.provider_id }}
          REPO_URL: ${{ steps.parse.outputs.repo_url }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
          LGTM_OUTCOME: ${{ steps.lgtm.outcome }}
          LGTM_SCORE: ${{ steps.lgtm.outputs.score || steps.lgtm_defaults.outputs.score }}
          LGTM_SPEC: ${{ steps.lgtm.outputs.spec-compliance || steps.lgtm_defaults.outputs.spec-compliance }}
          LGTM_SECURITY: ${{ steps.lgtm.outputs.security || steps.lgtm_defaults.outputs.security }}
          LGTM_CONTENT: ${{ steps.lgtm.outputs.content || steps.lgtm_defaults.outputs.content }}
          LGTM_TESTING: ${{ steps.lgtm.outputs.testing || steps.lgtm_defaults.outputs.testing }}
          LGTM_ORIGINALITY: ${{ steps.lgtm.outputs.originality || steps.lgtm_defaults.outputs.originality }}
        with:
          script: |
            const e = process.env;
            const note = e.LGTM_OUTCOME === 'failure'
              ? '⚠️ **Note**: LGTM validation temporarily unavailable - needs manual skill review'
              : '';
            const comment = `## ✅ Validation Successful!

            Hey @${e.ISSUE_USER}! Great news - your provider passed all validations! 🎉

            ### Validation Results
            - **LGTM Score**: ${e.LGTM_SCORE}/100 ✅
            - **Security Scan**: Passed (gitleaks) ✅
            - **Spec Compliance**: ${e.LGTM_SPEC}/100
            - **Security KPI**: ${e.LGTM_SECURITY}/100
            - **Content Quality**: ${e.LGTM_CONTENT}/100
            - **Testing**: ${e.LGTM_TESTING}/100
            - **Originality**: ${e.LGTM_ORIGINALITY}/100

            ${note}

            ### 🚀 Next Steps
            A pull request has been automatically created: #${e.PR_NUMBER}

            Once merged, your skills will be included in the daily aggregation runs and available via CDN.

            ### 📦 Provider Details
            - **Name**: ${e.PROVIDER_NAME}
            - **Repository**: ${e.REPO_URL}
            - **ID**: \`${e.PROVIDER_ID}\`

            Thanks for your contribution! 🙏`;

            await github.rest.issues.createComment({
              issue_number: Number(e.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

      - name: Comment on issue - Validation Failed
        if: steps.check.outputs.validation_passed != 'true' && steps.lgtm.outputs.score
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
          ISSUE_USER: ${{ steps.parse.outputs.issue_user }}
          GITLEAKS_PASSED: ${{ steps.gitleaks.outputs.gitleaks_passed }}
          LGTM_SCORE: ${{ steps.lgtm.outputs.score }}
          LGTM_SPEC: ${{ steps.lgtm.outputs.spec-compliance }}
          LGTM_SECURITY: ${{ steps.lgtm.outputs.security }}
          LGTM_CONTENT: ${{ steps.lgtm.outputs.content }}
          LGTM_TESTING: ${{ steps.lgtm.outputs.testing }}
          LGTM_ORIGINALITY: ${{ steps.lgtm.outputs.originality }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const e = process.env;
            const gitleaksPassed = e.GITLEAKS_PASSED === 'true';
            const lgtmScore = Number(e.LGTM_SCORE);

            const issues = [];
            if (!gitleaksPassed) {
              issues.push('- ❌ **Gitleaks**: Potential secrets detected in repository');
            }
            if (lgtmScore < 70) {
              issues.push(`- ❌ **LGTM Score**: ${e.LGTM_SCORE}/100 (minimum: 70)`);
            }

            const comment = `## ❌ Validation Issues Detected

            Hey @${e.ISSUE_USER}, thanks for your contribution! However, the automated validation found some issues that need to be addressed:

            ${issues.join('\n')}

            ### Detailed Results
            - **LGTM Score**: ${e.LGTM_SCORE}/100 (minimum: 70)
            - **Spec Compliance**: ${e.LGTM_SPEC}/100
            - **Security KPI**: ${e.LGTM_SECURITY}/100
            - **Content Quality**: ${e.LGTM_CONTENT}/100
            - **Testing**: ${e.LGTM_TESTING}/100
            - **Originality**: ${e.LGTM_ORIGINALITY}/100
            - **Gitleaks**: ${gitleaksPassed ? '✅ Passed' : '❌ Failed'}

            ### 🔧 How to Fix

            ${!gitleaksPassed ? `
            **Secrets Detected**: Please review your repository for hardcoded API keys, tokens, passwords, or other sensitive data. Remove them and use environment variables instead.
            ` : ''}

            ${lgtmScore < 70 ? `
            **Low Quality Score**: Your skills need improvement in these areas:
            - Add clear examples and usage instructions
            - Include test cases
            - Follow the [SKILL.md format](https://github.com/dmgrok/agent-plugins/blob/main/schema/catalog-schema.json)
            - Ensure no security vulnerabilities
            ` : ''}

            ### 📊 Validation Reports
            Full validation reports are available in the [workflow artifacts](${e.RUN_URL}).

            Once you have fixed the issues, comment here and a maintainer will re-run validation. 🔄`;

            await github.rest.issues.createComment({
              issue_number: Number(e.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });

      - name: Add validation-failed label
        if: steps.check.outputs.validation_passed != 'true' && steps.parse.outputs.issue_number
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['validation-failed'],
            });

      - name: Add approved label
        if: steps.check.outputs.validation_passed == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.parse.outputs.issue_number }}
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: Number(process.env.ISSUE_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['approved', 'automated'],
            });

      # Removing the gate label lets a maintainer re-run validation by applying it again.
      - name: Remove maintainer approval label
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'run-provider-validation',
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
