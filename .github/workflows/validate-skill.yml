name: Validate Skill

# skills-ci checks one skills-dir per call: a directory of skill folders, or
# one folder that itself contains SKILL.md. This repository does not keep a
# skills/ tree. Catalogued skills stay in upstream repos, so a pull request
# can add a skill in any folder. Each changed folder that contains SKILL.md
# is one matrix row. An empty allowlist means any finding fails the called
# jobs (lint, trigger routing, injection, licences, malicious files).
# Trigger-case files are optional until evals/cases exists. That check looks
# one level down from skills-dir, so once cases exist, pass the parent
# directory of the skill folders rather than the skill folder itself.

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed-skills:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.detect.outputs.dirs }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List changed skill directories
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          python3 - << 'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          base = os.environ["BASE_SHA"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD"],
              text=True,
          ).splitlines()
          found = set()
          for rel in changed:
              rel = rel.strip()
              if not rel:
                  continue
              current = Path(rel).parent
              while True:
                  if (current / "SKILL.md").is_file():
                      found.add("." if current == Path(".") else current.as_posix())
                      break
                  if current == Path(".") or current.parent == current:
                      break
                  current = current.parent
          dirs = sorted(found)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("dirs=" + json.dumps(dirs) + "\n")
              handle.write("count=" + str(len(dirs)) + "\n")
          print("changed skill directories:", dirs)
          PY

  skills:
    needs: changed-skills
    if: needs.changed-skills.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.changed-skills.outputs.dirs) }}
    permissions:
      contents: read
    uses: dmgrok/skills-ci/.github/workflows/skills-ci.yml@56aafbb7fc938b0bec4d6375438842da55e97ceb
    with:
      skills-dir: ${{ matrix.dir }}
